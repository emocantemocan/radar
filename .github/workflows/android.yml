name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Testler (core)
        run: ./gradlew :core:test --no-daemon

      - name: APK derle
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: APK'ları yeniden adlandır
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RadarNavigasyon-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/RadarNavigasyon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RadarNavigasyon-apk
          path: dist/*.apk

      # "v" ile başlayan bir etiket (ör. v0.1.0) push'lanınca APK'yı Releases sayfasına koyar
      - name: Sürüm yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RadarNavigasyon.apk
